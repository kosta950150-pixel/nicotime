<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18"><title>NICOTIME — управление</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101a2b;--panel2:#14233a;--line:#203653;--text:#edf5ff;--muted:#91a6c1;--blue:#42a5ff;--cyan:#65d5ff;--red:#ff657d;--green:#58d6a0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#10294a 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:linear-gradient(135deg,#167bd0,#2855b8);color:white;font-weight:650}
button.secondary{background:#1a2a42;border:1px solid var(--line);color:var(--text)}button.danger{background:#482033;color:#ffb9c4;border:1px solid #773044}
button.small{padding:7px 10px;font-size:13px}.wrap{max-width:980px;margin:auto;padding:18px 14px 44px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-weight:850;letter-spacing:2px;font-size:22px}.brand span{color:var(--cyan)}.sub{color:var(--muted);font-size:12px}.panel{background:linear-gradient(145deg,rgba(18,31,51,.97),rgba(12,21,36,.97));border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 16px 45px #0003}.hidden{display:none!important}.login{max-width:430px;margin:12vh auto}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}input,textarea,select{width:100%;background:#091321;border:1px solid #29415f;color:var(--text);border-radius:11px;padding:12px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--blue)}textarea{min-height:75px;resize:vertical}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px;margin:10px 0 14px}.tab{white-space:nowrap;background:#101e31;border:1px solid var(--line);color:#b9cce2}.tab.active{background:#123b61;border-color:#267fc4;color:white}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar input{min-width:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:#0d1929;border:1px solid var(--line);border-radius:15px;padding:14px;min-width:0}.product h3{font-size:16px;margin:0 0 5px;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted)}.pills{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.pill{font-size:11px;padding:4px 8px;border-radius:99px;background:#1c3550;color:#9fd9ff}.pill.red{background:#47202e;color:#ffb1c0}.pill.green{background:#153b34;color:#83e4bd}.pill.gold{background:#473a1c;color:#ffdf8c}.variant{border-top:1px solid #20334b;padding:9px 0;display:flex;justify-content:space-between;gap:8px;font-size:13px}.actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.empty{text-align:center;padding:35px 12px;color:var(--muted)}.modal{position:fixed;inset:0;background:#020711c9;display:grid;place-items:end center;padding:12px;z-index:5}.sheet{width:min(620px,100%);max-height:92vh;overflow:auto;background:#101c2d;border:1px solid #2b4667;border-radius:20px;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c3550;border:1px solid #3b6d9d;padding:10px 16px;border-radius:12px;z-index:9;max-width:90%;text-align:center}.footer{text-align:center;color:#60758e;font-size:11px;margin-top:25px}
@media(max-width:600px){.wrap{padding:14px 12px 32px}.cards{grid-template-columns:1fr}.top{margin-bottom:16px}.panel{padding:14px}.head h1{font-size:20px}.toolbar{flex-direction:column}.row.mobile-stack{flex-direction:column}.modal{padding:0}.sheet{border-radius:20px 20px 0 0;max-height:94vh;padding-bottom:calc(18px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><div class="brand">NICO<span>TIME</span></div><div class="sub">ВНУТРЕННЯЯ СИСТЕМА УЧЁТА</div></div><div id="status" class="sub">Подключение…</div></header>
  <section id="login" class="panel login">
    <h1>Вход администратора</h1><p class="muted">Доступ только с разрешённого Telegram-аккаунта.</p>
    <div class="field"><label>Пароль администратора</label><input id="password" type="password" placeholder="Введите пароль" autocomplete="current-password"></div>
    <button style="width:100%" onclick="login()">Войти в панель</button><p id="loginError" class="muted"></p>
    <div class="sub" style="margin-top:12px">Откройте приложение через Telegram-бота.</div>
  </section>
  <main id="app" class="hidden">
    <div class="head"><div><h1>Управление товарами</h1><div class="sub">Изменения сохраняются в базе данных</div></div><button class="secondary small" onclick="logout()">Выйти</button></div>
    <div id="tabs" class="tabs"></div>
    <div class="toolbar"><input id="search" placeholder="Поиск товара…" oninput="renderProducts()"><button onclick="openProduct()">＋ Добавить товар</button></div>
    <div id="products" class="cards"></div>
    <div class="footer">NICOTIME · Внутренний учёт · Обновление данных автоматически</div>
  </main>
</div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheethead"><h2 id="modalTitle">Товар</h2><button class="secondary small" onclick="closeModal()">Закрыть</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();tg.setHeaderColor('#080d18');tg.setBackgroundColor('#080d18')}
let token=sessionStorage.getItem('nt_token')||'',categories=[],products=[],activeCategory=0,refreshTimer=null;
const initData=tg?.initData||'';
const $=id=>document.getElementById(id);
async function api(path,opts={}){const r=await fetch('/api'+path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...opts.headers}});let data={};try{data=await r.json()}catch{}if(!r.ok){if(r.status===401){logout(false)}throw new Error(data.detail||'Ошибка запроса')}return data}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
async function login(){ $('loginError').textContent='Проверяем доступ…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:initData,password:$('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Не удалось войти');token=d.token;sessionStorage.setItem('nt_token',token);$('password').value='';$('login').classList.add('hidden');$('app').classList.remove('hidden');$('status').textContent='● Панель активна';await loadAll();refreshTimer=setInterval(loadAllQuiet,12000)}catch(e){$('loginError').textContent=e.message}}
function logout(call=true){if(refreshTimer)clearInterval(refreshTimer);if(call&&token)fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+token}}).catch(()=>{});token='';sessionStorage.removeItem('nt_token');$('app').classList.add('hidden');$('login').classList.remove('hidden');$('status').textContent='Требуется вход'}
async function loadAll(){categories=await api('/categories');await loadProducts();renderTabs()}
async function loadAllQuiet(){try{const before=JSON.stringify(products);await loadProducts();if(before!==JSON.stringify(products))renderProducts()}catch(e){}}
async function loadProducts(){products=await api('/products'+(activeCategory?'?category_id='+activeCategory:''));renderProducts()}
function renderTabs(){ $('tabs').innerHTML='<button class="tab '+(!activeCategory?'active':'')+'" onclick="selectCategory(0)">Все товары</button>'+categories.map(c=>`<button class="tab ${activeCategory===c.id?'active':''}" onclick="selectCategory(${c.id})">${esc(c.name)}</button>`).join('')}
async function selectCategory(id){activeCategory=id;renderTabs();await loadProducts()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderProducts(){const q=$('search').value.toLowerCase();const list=products.filter(p=>p.name.toLowerCase().includes(q));$('products').innerHTML=list.length?list.map(p=>`<article class="product"><h3>${esc(p.name)}</h3><div class="meta">${esc(p.category_name)} · ${Number(p.price).toLocaleString('ru-RU')} ₽</div><div class="pills">${p.is_new?'<span class="pill green">Новинка</span>':''}${p.discount_percent?`<span class="pill gold">Скидка ${p.discount_percent}%</span>`:''}${!p.has_stock?'<span class="pill red">Нет в наличии</span>':''}${!p.is_active?'<span class="pill red">Скрыт</span>':''}</div><div class="meta">${esc(p.description||'Без описания')} · Всего: ${p.total_stock} шт.</div>${p.variants.map(v=>`<div class="variant"><span><b>${esc(v.name)}</b><br><span class="meta">${esc(v.attributes||'')}</span></span><span>${v.stock} шт.</span></div>`).join('')}<div class="actions"><button class="small" onclick="openProduct(${p.id})">Изменить</button><button class="secondary small" onclick="openVariant(${p.id})">＋ Вариант</button><button class="danger small" onclick="deleteProduct(${p.id})">Удалить</button></div></article>`).join(''):'<div class="empty">Товаров пока нет.<br>Добавьте первый товар.</div>'}
function openProduct(id){const p=products.find(x=>x.id===id);$('modalTitle').textContent=p?'Редактирование товара':'Новый товар';$('modalBody').innerHTML=`<div class="field"><label>Название</label><input id="f_name" value="${esc(p?.name||'')}" placeholder="Название товара"></div><div class="field"><label>Категория</label><select id="f_cat">${categories.map(c=>`<option value="${c.id}" ${p?.category_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Описание / характеристики</label><textarea id="f_desc">${esc(p?.description||'')}</textarea></div><div class="row"><div class="field"><label>Цена, ₽</label><input id="f_price" type="number" min="0" step="0.01" value="${p?.price||0}"></div><div class="field"><label>Скидка, %</label><input id="f_discount" type="number" min="0" max="100" value="${p?.discount_percent||0}"></div></div><div class="row"><label><input id="f_new" type="checkbox" style="width:auto" ${p?.is_new?'checked':''}> Новинка</label><label><input id="f_active" type="checkbox" style="width:auto" ${p?.is_active!==0?'checked':''}> Активен</label></div><div class="actions"><button onclick="saveProduct(${id||0})">Сохранить</button>${p?`<button class="secondary" onclick="openVariant(${p.id})">Добавить вариант</button>`:''}</div>`;$('modal').classList.remove('hidden')}
async function saveProduct(id){try{const body={category_id:+$('f_cat').value,name:$('f_name').value,description:$('f_desc').value,price:+$('f_price').value,discount_percent:+$('f_discount').value,is_new:$('f_new').checked,is_active:$('f_active').checked};await api('/products'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(body)});closeModal();await loadAll();toast('Товар сохранён')}catch(e){toast(e.message)}}
function openVariant(productId,variantId){const p=products.find(x=>x.id===productId),v=p?.variants.find(x=>x.id===variantId);$('modalTitle').textContent=v?'Изменить вариант':'Новый вариант товара';$('modalBody').innerHTML=`<div class="field"><label>Название варианта (например, Малина или 0.2 Ом)</label><input id="v_name" value="${esc(v?.name||'')}"></div><div class="field"><label>Характеристики (цвет, сопротивление и т. д.)</label><input id="v_attr" value="${esc(v?.attributes||'')}"></div><div class="field"><label>Количество на складе, шт.</label><input id="v_stock" type="number" min="0" value="${v?.stock||0}"></div><div class="actions"><button onclick="saveVariant(${productId},${variantId||0})">Сохранить вариант</button>${v?`<button class="danger" onclick="deleteVariant(${v.id})">Удалить вариант</button>`:''}</div>`;$('modal').classList.remove('hidden')}
async function saveVariant(pid,vid){try{const body={name:$('v_name').value,attributes:$('v_attr').value,stock:+$('v_stock').value};await api(vid?'/variants/'+vid:'/products/'+pid+'/variants',{method:vid?'PUT':'POST',body:JSON.stringify(body)});closeModal();await loadAll();toast('Вариант сохранён')}catch(e){toast(e.message)}}
async function deleteVariant(id){if(!confirm('Удалить этот вариант?'))return;try{await api('/variants/'+id,{method:'DELETE'});closeModal();await loadAll();toast('Вариант удалён')}catch(e){toast(e.message)}}
async function deleteProduct(id){if(!confirm('Удалить товар вместе со всеми вариантами?'))return;try{await api('/products/'+id,{method:'DELETE'});await loadAll();toast('Товар удалён')}catch(e){toast(e.message)}}
function closeModal(){$('modal').classList.add('hidden')}
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
if(token){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadAll().then(()=>{refreshTimer=setInterval(loadAllQuiet,12000)}).catch(()=>{})}else{$('status').textContent=tg?'Telegram подключён':'Откройте через Telegram'}
</script>
</body></html>
